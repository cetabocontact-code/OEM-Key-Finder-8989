databases:
  - name: samafood-db
    plan: free

services:
  - type: web
    name: samafood-vendor-app
    env: python
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: gunicorn "samafood:create_app()" --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SAMA_SECRET_KEY
        generateValue: true
      - key: SAMA_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: samafood-db
          property: connectionString
