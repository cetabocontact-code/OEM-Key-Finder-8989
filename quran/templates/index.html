<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>بحث القرآن الكريم — Quranic Word Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <header>
    <h1>بحث القرآن الكريم</h1>
    <p class="subtitle">بحث دقيق عن الكلمات في القرآن الكريم (الرسم العثماني)</p>
  </header>

  <form id="searchForm" autocomplete="off">
    <input
      id="query"
      name="q"
      type="search"
      placeholder="اكتب كلمة، أو جذراً مثل: حمر، كتب، رحم"
      aria-label="كلمة البحث"
      autofocus
      required
    />
    <button type="submit">بحث</button>
  </form>

  <div class="mode-chips" role="radiogroup" aria-label="نوع البحث">
    <label><input type="radio" name="mode" value="exact" checked /><span>كلمة</span></label>
    <label><input type="radio" name="mode" value="root" /><span>جذر</span></label>
    <label><input type="radio" name="mode" value="contains" /><span>موسّع</span></label>
  </div>

  <div id="recent" class="recent" hidden>
    <span class="recent-label">البحث الأخير:</span>
    <span id="recentList" class="recent-list"></span>
    <button id="recentClear" type="button" class="recent-clear" title="مسح">مسح</button>
  </div>

  <section id="results" aria-live="polite"></section>

  <div id="morphCard" class="morph-card" hidden>
    <button class="morph-close" type="button" aria-label="إغلاق">×</button>
    <div class="morph-word"></div>
    <dl class="morph-grid">
      <dt>الجذر</dt><dd class="morph-root">—</dd>
      <dt>اللم</dt><dd class="morph-lemma">—</dd>
      <dt>النوع</dt><dd class="morph-pos">—</dd>
    </dl>
    <button class="morph-search-root" type="button">عرض كل المشتقات من الجذر</button>
  </div>

  <footer>
    <p>النص العثماني: حفص عن عاصم · فهرس البحث: الرسم الإملائي · المورفولوجيا: Quranic Arabic Corpus</p>
  </footer>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
